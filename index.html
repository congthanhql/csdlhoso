<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT-EDU Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface2: #f7f9ff;
  --border: #e2e8f8;
  --text: #1a1f36;
  --text2: #64748b;
  --primary: #3b5bdb;
  --primary-light: #eef2ff;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --shadow: 0 2px 16px rgba(59,91,219,.08);
  --shadow-lg: 0 8px 32px rgba(59,91,219,.14);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d2e;
  --surface2: #22263a;
  --border: #2d3154;
  --text: #e8ecf8;
  --text2: #8892b0;
  --primary: #5c7cfa;
  --primary-light: #1e2340;
  --shadow: 0 2px 16px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.4);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Be Vietnam Pro',sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; transition:background var(--transition),color var(--transition); }

/* ── LOGIN ── */
#loginPage {
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:20px; background:var(--bg);
}
.login-wrap {
  width:100%; max-width:420px;
}
.login-logo {
  text-align:center; margin-bottom:28px;
}
.login-logo .brand {
  font-size:28px; font-weight:800; color:var(--primary);
  letter-spacing:-1px;
}
.login-logo .sub {
  font-size:13px; color:var(--text2); margin-top:4px;
}
.login-box {
  background:var(--surface); border-radius:24px; padding:32px;
  box-shadow:var(--shadow-lg); border:1px solid var(--border);
}
.login-box h2 {
  font-size:20px; font-weight:700; margin-bottom:24px; color:var(--text);
  text-align:center;
}
.field { margin-bottom:14px; position:relative; }
.field label { font-size:12px; font-weight:600; color:var(--text2); display:block; margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase; }
.field input {
  width:100%; padding:13px 16px; border:1.5px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface2); color:var(--text);
  font-size:15px; outline:none; transition:border var(--transition);
  font-family:'Be Vietnam Pro',sans-serif;
}
.field input:focus { border-color:var(--primary); }
.field input::placeholder { color:var(--text2); }
.btn-primary {
  width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
  background:var(--primary); color:#fff; font-weight:700; font-size:15px;
  cursor:pointer; transition:all var(--transition); letter-spacing:.3px;
  font-family:'Be Vietnam Pro',sans-serif;
}
.btn-primary:hover { opacity:.9; transform:translateY(-1px); box-shadow:0 4px 16px rgba(59,91,219,.3); }
.btn-primary:active { transform:translateY(0); }
.err-msg { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; border-radius:var(--radius-sm); padding:10px 14px; font-size:14px; margin-bottom:14px; display:none; font-weight:500; }
[data-theme="dark"] .err-msg { background:#2d1515; border-color:#7f1d1d; color:#fca5a5; }

/* ── APP ── */
#app { display:none; min-height:100vh; }

/* Header */
.header {
  position:sticky; top:0; z-index:100; background:var(--surface);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow);
  padding:0 20px;
}
.header-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; gap:12px;
}
.logo-text { font-size:20px; font-weight:800; color:var(--primary); letter-spacing:-0.5px; }
.logo-text span { color:var(--text2); font-weight:400; font-size:14px; display:block; }
.header-actions { display:flex; gap:8px; align-items:center; }
.icon-btn {
  width:38px; height:38px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface2); color:var(--text2); cursor:pointer; display:flex;
  align-items:center; justify-content:center; font-size:17px; transition:all var(--transition);
}
.icon-btn:hover { border-color:var(--primary); color:var(--primary); }
.btn-logout {
  padding:8px 14px; border:1.5px solid var(--danger); border-radius:var(--radius-sm);
  background:transparent; color:var(--danger); cursor:pointer; font-size:13px;
  font-weight:600; transition:all var(--transition); font-family:'Be Vietnam Pro',sans-serif;
}
.btn-logout:hover { background:var(--danger); color:#fff; }

.search-bar {
  display:flex; gap:10px; padding-bottom:14px;
}
.search-bar input {
  flex:1; padding:11px 16px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface2); color:var(--text); font-size:14px; outline:none;
  transition:border var(--transition); font-family:'Be Vietnam Pro',sans-serif;
}
.search-bar input:focus { border-color:var(--primary); }
.search-bar input::placeholder { color:var(--text2); }
.btn-search {
  padding:0 20px; border:none; border-radius:var(--radius-sm); background:var(--primary);
  color:#fff; font-weight:600; cursor:pointer; font-size:14px;
  font-family:'Be Vietnam Pro',sans-serif; white-space:nowrap; transition:all var(--transition);
}
.btn-search:hover { opacity:.9; }

/* Stats bar */
.stats-bar {
  display:flex; gap:8px; padding:14px 20px;
  overflow-x:auto; scrollbar-width:none;
}
.stats-bar::-webkit-scrollbar { display:none; }
.stat-chip {
  background:var(--surface); border:1px solid var(--border); border-radius:100px;
  padding:6px 14px; font-size:12px; font-weight:600; color:var(--text2);
  white-space:nowrap; flex-shrink:0;
}
.stat-chip span { color:var(--primary); }

/* List */
.list-wrap { padding:12px 16px; max-width:900px; margin:0 auto; }
.section-label {
  font-size:11px; font-weight:700; color:var(--text2); letter-spacing:1px;
  text-transform:uppercase; margin-bottom:10px; padding:0 4px;
}

/* Desktop: grid */
@media(min-width:640px) {
  .items-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
}
@media(min-width:900px) {
  .items-grid { grid-template-columns:1fr 1fr 1fr; }
}

.item-card {
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:all var(--transition); position:relative;
  overflow:hidden;
}
.item-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--primary); opacity:0; transition:opacity var(--transition);
}
.item-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.item-card:hover::before { opacity:1; }
.card-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.card-icon {
  width:40px; height:40px; border-radius:10px; background:var(--primary-light);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
}
.card-uid { font-size:11px; color:var(--text2); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
.card-name { font-size:15px; font-weight:700; color:var(--text); margin-top:1px; line-height:1.3; }
.card-meta { display:flex; gap:6px; flex-wrap:wrap; }
.meta-tag {
  font-size:11px; padding:3px 10px; border-radius:100px; font-weight:600;
  background:var(--surface2); color:var(--text2); border:1px solid var(--border);
}
.meta-tag.code { background:var(--primary-light); color:var(--primary); border-color:transparent; }

.not-found {
  display:none; background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:32px; text-align:center; color:var(--text2);
  font-size:15px; font-weight:500; margin:8px 0;
}
.not-found .icon { font-size:40px; margin-bottom:10px; }

.loading {
  text-align:center; padding:40px; color:var(--text2);
}
.spinner {
  width:32px; height:32px; border:3px solid var(--border);
  border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* FAB - Add button */
.fab {
  position:fixed; bottom:24px; right:24px; z-index:200;
  width:56px; height:56px; border-radius:50%; background:var(--primary);
  border:none; color:#fff; font-size:28px; cursor:pointer;
  box-shadow:0 4px 24px rgba(59,91,219,.4); transition:all var(--transition);
  display:flex; align-items:center; justify-content:center;
}
.fab:hover { transform:scale(1.08); box-shadow:0 8px 32px rgba(59,91,219,.5); }

/* MODAL */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  display:none; justify-content:center; align-items:flex-end;
  z-index:500; backdrop-filter:blur(4px);
  padding:0;
}
@media(min-width:640px) {
  .modal-overlay { align-items:center; padding:20px; }
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--surface); width:100%; max-width:500px;
  border-radius:24px 24px 0 0; padding:24px; max-height:92vh;
  overflow-y:auto; position:relative; animation:slideUp .25s ease;
}
@media(min-width:640px) {
  .modal-box { border-radius:24px; }
}
@keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal-header {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
}
.modal-title { font-size:18px; font-weight:800; color:var(--text); }
.btn-close {
  width:34px; height:34px; border:none; border-radius:50%; background:var(--surface2);
  color:var(--text2); cursor:pointer; font-size:16px; display:flex;
  align-items:center; justify-content:center; transition:all var(--transition);
}
.btn-close:hover { background:var(--danger); color:#fff; }

/* Detail modal */
.detail-section { margin-bottom:16px; }
.detail-row {
  display:flex; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--border); align-items:flex-start;
}
.detail-row:last-child { border-bottom:none; }
.detail-label { font-size:12px; font-weight:700; color:var(--text2); min-width:130px; letter-spacing:.3px; flex-shrink:0; padding-top:1px; }
.detail-val { font-size:14px; font-weight:500; color:var(--text); word-break:break-word; }
.btn-open-file {
  display:flex; align-items:center; gap:8px; width:100%; padding:14px;
  border:none; border-radius:var(--radius-sm); background:var(--success);
  color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  transition:all var(--transition); text-decoration:none; justify-content:center;
  margin-top:12px; font-family:'Be Vietnam Pro',sans-serif;
}
.btn-open-file:hover { opacity:.9; transform:translateY(-1px); }
.btn-delete {
  display:flex; align-items:center; gap:8px; width:100%; padding:12px;
  border:1.5px solid var(--danger); border-radius:var(--radius-sm); background:transparent;
  color:var(--danger); font-weight:600; font-size:14px; cursor:pointer;
  transition:all var(--transition); justify-content:center; margin-top:8px;
  font-family:'Be Vietnam Pro',sans-serif;
}
.btn-delete:hover { background:var(--danger); color:#fff; }

/* Add form */
.form-row { margin-bottom:14px; }
.form-row label { font-size:12px; font-weight:700; color:var(--text2); display:block; margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase; }
.form-row input, .form-row textarea {
  width:100%; padding:12px 14px; border:1.5px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface2); color:var(--text);
  font-size:14px; outline:none; transition:border var(--transition);
  font-family:'Be Vietnam Pro',sans-serif;
}
.form-row input:focus, .form-row textarea:focus { border-color:var(--primary); }
.form-row input::placeholder, .form-row textarea::placeholder { color:var(--text2); }
.form-row textarea { resize:vertical; min-height:80px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:480px) { .form-grid { grid-template-columns:1fr; } }
.btn-submit {
  width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
  background:var(--primary); color:#fff; font-weight:700; font-size:15px;
  cursor:pointer; transition:all var(--transition); font-family:'Be Vietnam Pro',sans-serif;
  margin-top:4px;
}
.btn-submit:hover { opacity:.9; }
.btn-submit:disabled { opacity:.6; cursor:not-allowed; }

.toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:12px 20px;
  border-radius:100px; font-size:14px; font-weight:600; z-index:999;
  opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; }

/* Sync status */
.sync-dot {
  width:8px; height:8px; border-radius:50%; background:#10b981;
  display:inline-block; margin-right:6px; animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

</style>
</head>

    <div class="items-grid" id="list"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="openAddModal()" title="Thêm hồ sơ mới" style="display:none">＋</button>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="closeModalOnBg(event,'detailModal')">

      <div class="modal-title">📋 Thông Tin Hồ Sơ</div>
      <button class="btn-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal" onclick="closeModalOnBg(event,'addModal')">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">➕ Thêm Hồ Sơ Mới</div>
      <button class="btn-close" onclick="closeAdd()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Mã UID *</label>
        <input id="f_uid" placeholder="VD: 1234">
      </div>
      <div class="form-row">
        <label>Mã Tham Chiếu *</label>
        <input id="f_code" placeholder="VD: MC-26S">
      </div>
    </div>
    <div class="form-row">
      <label>Tên PNG *</label>
      <input id="f_png" placeholder="VD: Con cái - Gia Đạo">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Ngày Xuất Bản</label>
        <input id="f_date" placeholder="VD: 04/25/2026">
      </div>
      <div class="form-row">
        <label>Tên Khách Hàng</label>
        <input id="f_kh" placeholder="VD: Reader">

    </div>
    <div class="form-row">
      <label>Link Hồ Sơ (Google Drive)</label>

    </div>
    <button class="btn-submit" id="submitBtn" onclick="addRecord()">✓ Lưu Hồ Sơ</button>
  </div>
</div>

<div class="toast" id="toast"></div>

    { uid:"7892", code:"GT-17C", png:"Lá Số Tử Vi - Đinh Gia Trí", date:"03/07/2026", kh:"Reader", link:"https://drive.google.com/file/d/1SF-olbzDtkyg99eFztkfS5rEZCB6Jy4K/view?usp=drive_link" },
    { uid:"3569", code:"CL-35S", png:"Tình cảm Hồ Nhi Kết hợp Bài Tây và Lenormand", date:"14/03/2026", kh:"Reader", link:"https://drive.google.com/file/d/11eNlI2TgCcJuIXnOIo74JfHzLzMuIe-a/view?usp=drive_link" },
    { uid:"8052", code:"HN-05G", png:"Lá Số Tử Vi Hồ Nguyễn Yến Nhi", date:"07/03/2026", kh:"Reader", link:"https://drive.google.com/file/d/1JZezjfdOa2U73hyLcQtKrJwQ9ERHtzZN/view?usp=drive_link" },
    { uid:"1527", code:"BC-27S", png:"Luyện thuốc chú lỗ Ban - Thư", date:"04/19/2026", kh:"Reader", link:"https://drive.google.com/file/d/1lsXgSkWxx3vQeHN9lh689n-TPkEpJisP/view?usp=drive_link" },
    { uid:"8960", code:"TQ-04N", png:"Tổng quan tháng 4/26 CTE", date:"03/2026", kh:"Reader", link:"https://drive.google.com/file/d/1qAF6g7017J_eoSzlZtJCLQP6eyS3cbM-/view?usp=drive_link" },
    { uid:"1804", code:"SC-18T", png:"Soi căn Huỳnh Công", date:"04/18/2026", kh:"Reader", link:"https://drive.google.com/file/d/1ed91iBDKahir3mxSFjg_eFvuWHH79nOg/view?usp=drive_link" },
    { uid:"0000", code:"VIP2026", png:"Tổng quan năm 2026 HCT", date:"04/2026", kh:"Reader", link:"https://drive.google.com/file/d/17wkki6I0n3uStvqStzKn4VbqZRZeUssm/view?usp=drive_link" }
  ];

  let allRecords = [];
  let currentKey = null;

  // ── AUTH ──
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("fabBtn").style.display = "flex";
      setupRealtimeSync();
    } else {
      document.getElementById("loginPage").style.display = "flex";
      document.getElementById("app").style.display = "none";
      document.getElementById("fabBtn").style.display = "none";
    }
  });

  window.login = async function() {
    const email = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();
    const errEl = document.getElementById("loginErr");
    errEl.style.display = "none";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      errEl.style.display = "block";
    }
  };

  window.logout = async function() {
    await signOut(auth);
    location.reload();
  };

  document.getElementById("user").addEventListener("keypress", e => { if(e.key==="Enter") login(); });
  document.getElementById("pass").addEventListener("keypress", e => { if(e.key==="Enter") login(); });

  // ── FIREBASE SYNC ──
  async function seedIfEmpty() {
    const snap = await get(ref(db, "records"));
    if (!snap.exists()) {
      // Upload seed data
      for(const r of SEED_RECORDS) {
        const nr = push(ref(db, "records"));
        await set(nr, r);
      }
    }
  }

  function setupRealtimeSync() {
    seedIfEmpty();
    onValue(ref(db, "records"), snap => {
      allRecords = [];
      if(snap.exists()) {
        snap.forEach(child => {
          allRecords.push({ _key: child.key, ...child.val() });
        });
        allRecords.reverse();
      }
      document.getElementById("loadingEl").style.display = "none";
      document.getElementById("totalCount").textContent = allRecords.length;
      renderList(allRecords);
    });
  }

  // ── RENDER ──
  function renderList(data) {
    const listEl = document.getElementById("list");
    const nf = document.getElementById("notFound");
    if(!data.length) { listEl.innerHTML=""; nf.style.display="block"; return; }
    nf.style.display = "none";
    listEl.innerHTML = data.map(item => `
      <div class="item-card" onclick="showDetail('${item._key}')">
        <div class="card-top">
          <div class="card-icon">📄</div>
          <div>
            <div class="card-uid">UID: ${item.uid}</div>
            <div class="card-name">${item.png || '—'}</div>
          </div>
        </div>
        <div class="card-meta">
          <span class="meta-tag code">${item.code}</span>
          ${item.date ? `<span class="meta-tag">📅 ${item.date}</span>` : ''}
          ${item.kh ? `<span class="meta-tag">👤 ${item.kh}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  // ── SEARCH ──
  window.handleEnter = e => { if(e.key==="Enter") searchData(); };
  window.searchData = function() {
    const key = document.getElementById("searchInput").value.trim().toLowerCase();
    const fc = document.getElementById("filterChip");
    const fcNum = document.getElementById("filterCount");
    if(!key) {
      renderList(allRecords);
      fc.style.display="none";
      return;
    }
    const res = allRecords.filter(i =>
      (i.uid||"").toLowerCase().includes(key) ||
      (i.code||"").toLowerCase().includes(key) ||
      (i.png||"").toLowerCase().includes(key)
    );
    fcNum.textContent = res.length;
    fc.style.display = "block";
    renderList(res);
  };

  // ── DETAIL ──
  window.showDetail = function(key) {
    currentKey = key;
    const d = allRecords.find(x => x._key === key);
    if(!d) return;
    document.getElementById("detailContent").innerHTML = `
      <div class="detail-section">
        <div class="detail-row"><span class="detail-label">Mã UID</span><span class="detail-val">${d.uid||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Mã Tham Chiếu</span><span class="detail-val">${d.code||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Tên PNG</span><span class="detail-val">${d.png||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Ngày Xuất Bản</span><span class="detail-val">${d.date||'—'}</span></div>
        <div class="detail-row"><span class="detail-label">Khách Hàng</span><span class="detail-val">${d.kh||'—'}</span></div>
        ${d.link ? `<div class="detail-row"><span class="detail-label">Link</span><span class="detail-val" style="word-break:break-all;font-size:12px;color:var(--primary)">${d.link}</span></div>` : ''}
      </div>
      ${d.link ? `<a href="${d.link}" target="_blank" class="btn-open-file">📂 Mở Hồ Sơ</a>` : `<div style="color:var(--text2);text-align:center;padding:12px;">Chưa có link hồ sơ</div>`}
      <button class="btn-delete" onclick="deleteRecord('${d._key}')">🗑 Xóa Hồ Sơ Này</button>
    `;
    document.getElementById("detailModal").classList.add("open");
  };

  window.closeDetail = () => {
    document.getElementById("detailModal").classList.remove("open");
    currentKey = null;
  };

  window.deleteRecord = async function(key) {
    if(!confirm("Bạn có chắc muốn xóa hồ sơ này?")) return;
    await remove(ref(db, "records/" + key));
    closeDetail();
    showToast("✅ Đã xóa hồ sơ");
  };

  // ── ADD ──
  window.openAddModal = () => {
    ["f_uid","f_code","f_png","f_date","f_kh","f_link"].forEach(id => document.getElementById(id).value="");
    document.getElementById("addModal").classList.add("open");
  };
  window.closeAdd = () => document.getElementById("addModal").classList.remove("open");

  window.addRecord = async function() {
    const uid = document.getElementById("f_uid").value.trim();
    const code = document.getElementById("f_code").value.trim();
    const png = document.getElementById("f_png").value.trim();
    if(!uid || !code || !png) { showToast("⚠️ Vui lòng nhập UID, Mã và Tên PNG"); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Đang lưu...";
    try {
      const nr = push(ref(db, "records"));
      await set(nr, {
        uid, code, png,
        date: document.getElementById("f_date").value.trim(),
        kh: document.getElementById("f_kh").value.trim(),
        link: document.getElementById("f_link").value.trim()
      });
      closeAdd();
      showToast("✅ Đã thêm hồ sơ thành công");
    } catch(e) {
      showToast("❌ Lỗi: " + e.message);
    }
    btn.disabled = false; btn.textContent = "✓ Lưu Hồ Sơ";
  };

  // ── MODAL BG CLICK ──
  window.closeModalOnBg = (e, id) => {
    if(e.target.classList.contains("modal-overlay")) {
      document.getElementById(id).classList.remove("open");
    }
  };

  // ── THEME ──
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").textContent = saved==="dark" ? "☀️" : "🌙";

  window.toggleTheme = function() {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    document.getElementById("themeBtn").textContent = next==="dark" ? "☀️" : "🌙";
  };

  // ── TOAST ──
  window.showToast = function(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2800);
  };
</script>
</body>
</html>
