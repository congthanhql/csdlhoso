}

.loading-state {

  padding:40px;
  color: var(--text2);
  font-size:14px;
}

/* ─── MODAL ─── */
.overlay {
  position:fixed;
  inset:0;
  background: rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:999;
  backdrop-filter:blur(4px);
}

.overlay.open { display:flex; }

.modal-card {
  background: var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  width:100%;
  max-width:460px;
  position:relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  animation: modalIn .25s ease;
}

@keyframes modalIn {
  from { opacity:0; transform:scale(.96) translateY(12px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

.modal-close {
  position:absolute;
  right:16px; top:16px;
  width:32px; height:32px;
  border:none;
  border-radius:8px;
  background: var(--surface2);
  color: var(--text2);
  font-size:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

  font-weight:700;

.detail-label {

}

  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background: var(--success);
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  font-size:14px;
  font-weight:600;
  z-index:9999;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;
  box-shadow: 0 8px 24px rgba(16,185,129,.4);
}

.toast.show { transform:translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); box-shadow: 0 8px 24px rgba(239,68,68,.4); }

/* ─── MOBILE ONLY ─── */
@media(max-width:768px) {
  .desktop-only { display:none !important; }
  .mobile-list-wrap { padding:8px 12px 80px; }
  .fab {
    position:fixed;
    bottom:20px;
    right:20px;
    width:54px; height:54px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border:none;
    border-radius:50%;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(79,110,247,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
    z-index:100;
  }
  .fab:hover { transform:scale(1.08); }
  .page-header { display:none; }
  .top-bar { display:none !important; }
}

@media(min-width:769px) {
  .mobile-only { display:none !important; }
  .fab { display:none !important; }
  .mobile-header { display:none !important; }
}
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📂</div>
      <h1>CT-EDU Lookup</h1>
      <p>Hệ thống quản lý hồ sơ</p>
    </div>

    <div class="field-wrap">
      <label>Tên đăng nhập</label>
      <input id="loginUser" placeholder="Nhập tài khoản" autocomplete="username">
    </div>

    <div class="field-wrap">
      <label>Mật khẩu</label>
      <input id="loginPass" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
    </div>

    <button class="btn-primary" onclick="doLogin()">Đăng Nhập</button>
  </div>
</div>

<!-- ─── APP ─── -->
<div id="app">

  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar desktop-only">
    <div class="sidebar-logo">
      <div class="sb-icon">📂</div>
      <div>
        <div class="sb-title">CT-EDU</div>
        <div class="sb-sub">Lookup System</div>
      </div>
    </div>

    <div class="sb-stat-box">
      <div class="sb-stat-label">Tổng Hồ Sơ</div>
      <div class="sb-stat-value" id="totalCount">—</div>
    </div>

    <div class="sb-spacer"></div>

    <button class="btn-add-sidebar" onclick="openAdd()">
      ＋ Thêm Hồ Sơ Mới
    </button>

    <button class="btn-logout-sidebar" onclick="doLogout()">
      ⎋ Đăng Xuất
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- Mobile header -->
    <div class="mobile-header mobile-only">
      <div class="mobile-header-top">
        <div class="mobile-title">📂 CT-EDU</div>
        <div class="mobile-actions">
          <button class="icon-btn logout" onclick="doLogout()">⎋</button>
        </div>
      </div>
      <div class="mobile-search">
        <input id="searchMobile" placeholder="🔍 UID hoặc Mã tham chiếu…" onkeypress="handleEnterMobile(event)">
        <button onclick="doSearch()">Tìm</button>
      </div>
    </div>

    <!-- Desktop top bar -->
    <div class="top-bar desktop-only">
      <div class="page-header" style="margin:0;flex:1;">
        <div>
          <div class="page-title">Danh Sách Hồ Sơ</div>
          <div class="page-sub">Tất cả hồ sơ trong hệ thống</div>
        </div>
        <div class="count-badge"><span id="totalCountD">—</span> hồ sơ</div>
      </div>
      <div class="search-box">
        <input id="searchDesktop" placeholder="🔍 Nhập UID hoặc Mã tham chiếu…" onkeypress="handleEnterDesktop(event)">
        <button onclick="doSearch()">Tra Cứu</button>
      </div>
    </div>

    <!-- List -->
    <div id="recordList" class="grid-list mobile-list-wrap">
      <div class="loading-state">⏳ Đang tải dữ liệu…</div>
    </div>

  </main>
</div>

<!-- FAB mobile -->
<button class="fab mobile-only" onclick="openAdd()">＋</button>

<!-- ─── DETAIL MODAL ─── -->
<div class="overlay" id="detailOverlay" onclick="overlayClick(event,'detailOverlay')">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal('detailOverlay')">✕</button>
    <div class="modal-title">🗂 Thông Tin Hồ Sơ</div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- ─── ADD MODAL ─── -->
<div class="overlay" id="addOverlay" onclick="overlayClick(event,'addOverlay')">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal('addOverlay')">✕</button>
    <div class="modal-title">＋ Thêm Hồ Sơ Mới</div>
    <div class="form-grid">
      <div class="form-field">
        <label>Mã UID *</label>
        <input id="fUid" placeholder="VD: 0267">
      </div>
      <div class="form-field">
        <label>Mã Tham Chiếu *</label>
        <input id="fCode" placeholder="VD: MC-26S">
      </div>
      <div class="form-field">
        <label>Tên PNG *</label>
        <input id="fPng" placeholder="VD: Con cái - Gia Đạo">
      </div>
      <div class="form-field">
        <label>Ngày Xuất Bản</label>
        <input id="fDate" placeholder="VD: 25/04/2026">
      </div>
      <div class="form-field">
        <label>Tên Khách Hàng</label>
        <input id="fKh" placeholder="VD: Nguyễn Văn A">
      </div>
      <div class="form-field">
        <label>Link Hồ Sơ (Google Drive)</label>
        <input id="fLink" placeholder="https://drive.google.com/…">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal('addOverlay')">Huỷ</button>
      <button class="btn-save" id="btnSave" onclick="saveRecord()">💾 Lưu Hồ Sơ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LOGIN_USER = "bioverify@goooglegroups.com";
const LOGIN_PASS = "Thanh123@";

let allRecords = [];

/* ─── LOGIN ─── */
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if (u === LOGIN_USER && p === LOGIN_PASS) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('app').style.display = 'flex';
    listenRecords();
  } else {
    showToast('❌ Sai thông tin đăng nhập', true);
  }
}

function doLogout() {
  location.reload();
}

document.addEventListener('keypress', e => {
  const lp = document.getElementById('loginPage');
  if (lp.style.display !== 'none' && e.key === 'Enter') doLogin();
});

/* ─── FIREBASE INIT (runs after module loads) ─── */
window._initFirebase = function() {
  const db = window._fbDb;
  const r = window._fbRef;

  // Check if DB is empty, seed if needed
  const hosRef = r(db, 'hoSo');
  window._fbOnValue(hosRef, snap => {
    if (!snap.exists()) {
      // seed
      window._seedData.forEach(item => {
        window._fbPush(hosRef, item);
      });
    }
  }, { onlyOnce: true });
};

/* ─── LISTEN RECORDS ─── */
function listenRecords() {
  const db = window._fbDb;
  const r = window._fbRef;
  const hosRef = r(db, 'hoSo');

  window._fbOnValue(hosRef, snap => {
    allRecords = [];
    if (snap.exists()) {
      snap.forEach(child => {
        allRecords.push({ _key: child.key, ...child.val() });
      });
      // newest first
      allRecords.reverse();
    }
    updateCount(allRecords.length);
    renderList(allRecords);
  });
}

function updateCount(n) {
  const el1 = document.getElementById('totalCount');
  const el2 = document.getElementById('totalCountD');
  if (el1) el1.textContent = n;
  if (el2) el2.textContent = n;
}

/* ─── RENDER ─── */
function renderList(data) {
  const wrap = document.getElementById('recordList');
  if (!data || data.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>Không tìm thấy hồ sơ nào</p></div>`;
    return;
  }

  wrap.innerHTML = data.map(item => `
    <div class="record-card" onclick="showDetail('${item._key}')">
      <div class="card-icon">📄</div>
      <div class="card-body">
        <div class="card-uid">UID: ${item.uid || '—'} &nbsp;|&nbsp; ${item.code || '—'}</div>
        <div class="card-name">${item.png || '—'}</div>
        <div class="card-meta">${item.kh || ''} ${item.date ? '· ' + item.date : ''}</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  `).join('');
}

/* ─── SEARCH ─── */
function getSearchKey() {
  const dm = document.getElementById('searchDesktop');
  const mm = document.getElementById('searchMobile');
  return (dm && document.activeElement !== mm ? dm.value : mm ? mm.value : dm.value).trim().toLowerCase();
}

function doSearch() {
  const key = getSearchKey();
  if (!key) { renderList(allRecords); return; }
  const res = allRecords.filter(i =>
    (i.uid || '').toLowerCase().includes(key) ||
    (i.code || '').toLowerCase().includes(key) ||
    (i.png || '').toLowerCase().includes(key) ||
    (i.kh || '').toLowerCase().includes(key)
  );
  renderList(res);
}

function handleEnterDesktop(e) { if (e.key === 'Enter') doSearch(); }
function handleEnterMobile(e) { if (e.key === 'Enter') doSearch(); }

// sync search inputs
document.addEventListener('input', e => {
  const dm = document.getElementById('searchDesktop');
  const mm = document.getElementById('searchMobile');
  if (e.target === dm && mm) mm.value = dm.value;
  if (e.target === mm && dm) dm.value = mm.value;
});

/* ─── DETAIL ─── */
function showDetail(key) {
  const item = allRecords.find(i => i._key === key);
  if (!item) return;

  const linkBtn = item.link
    ? `<a href="${item.link}" target="_blank" class="btn-open-file">📂 Mở Hồ Sơ</a>`
    : `<button class="btn-open-file" style="background:#444;cursor:not-allowed;" disabled>⚠️ Chưa có link hồ sơ</button>`;

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-grid">
      <div class="detail-row">
        <div class="detail-label">Mã UID</div>
        <div class="detail-value mono">${item.uid || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Tham Chiếu</div>
        <div class="detail-value mono">${item.code || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Tên PNG</div>
        <div class="detail-value">${item.png || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Ngày XB</div>
        <div class="detail-value">${item.date || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Khách Hàng</div>
        <div class="detail-value">${item.kh || '—'}</div>
      </div>
    </div>
    ${linkBtn}
  `;

  openModal('detailOverlay');
}

/* ─── ADD ─── */
function openAdd() {
  ['fUid','fCode','fPng','fDate','fKh','fLink'].forEach(id => {
    document.getElementById(id).value = '';
  });
  openModal('addOverlay');
}

async function saveRecord() {
  const uid  = document.getElementById('fUid').value.trim();
  const code = document.getElementById('fCode').value.trim();
  const png  = document.getElementById('fPng').value.trim();
  const date = document.getElementById('fDate').value.trim();
  const kh   = document.getElementById('fKh').value.trim();
  const link = document.getElementById('fLink').value.trim();

  if (!uid || !code || !png) {
    showToast('⚠️ Vui lòng nhập UID, Mã tham chiếu và Tên PNG', true);
    return;
  }

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ Đang lưu…';

  try {
    const db = window._fbDb;
    const r = window._fbRef;
    const hosRef = r(db, 'hoSo');
    await window._fbPush(hosRef, { uid, code, png, date, kh, link });
    closeModal('addOverlay');
    showToast('✅ Đã thêm hồ sơ thành công!');
  } catch(err) {
    showToast('❌ Lỗi khi lưu: ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Lưu Hồ Sơ';
  }
}

/* ─── MODAL ─── */
function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function overlayClick(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}

/* ─── TOAST ─── */
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
